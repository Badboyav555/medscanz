<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MedScan+ | Smart Medicine Safety & Recovery</title>
    
    <!-- css/style.css & components.css & responsive.css -->
    <style>
        :root {
            --primary: #102A43;
            --secondary: #159A8C;
            --bg: #F5F8FA;
            --card: #FFFFFF;
            --text-primary: #102A43;
            --text-secondary: #64748B;
            --success: #159A8C;
            --warning: #D89B28;
            --danger: #D9534F;
            --border: #E2E8F0;
            --radius-card: 16px;
            --radius-btn: 12px;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-top: env(safe-area-inset-top, 0px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            font-size: 14px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            overscroll-behavior-y: none;
        }

        /* App Shell */
        #app-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background: var(--bg);
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.03);
            padding-bottom: calc(70px + var(--safe-bottom));
        }

        #app-container.gov-mode {
            max-width: 100%;
            padding-bottom: 0;
            background: #F1F5F9;
        }

        .screen {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .screen.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Typography */
        h1 { font-size: 26px; font-weight: 700; line-height: 1.2; }
        h2 { font-size: 20px; font-weight: 600; }
        h3 { font-size: 16px; font-weight: 600; }
        h4 { font-size: 14px; font-weight: 600; }
        p { font-size: 14px; color: var(--text-secondary); }
        small { font-size: 12px; }

        /* Header */
        .app-header {
            background: var(--card);
            padding: calc(16px + var(--safe-top)) 16px 16px 16px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .app-header h1 { font-size: 20px; }
        .app-header .sub { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 4px; }

        .header-action {
            width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: var(--bg); border: 1px solid var(--border);
            cursor: pointer; transition: 0.2s;
        }
        .header-action:hover { background: #e2e8f0; }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background: var(--card);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding-bottom: var(--safe-bottom);
            z-index: 999;
        }
        .nav-item {
            flex: 1;
            padding: 10px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-secondary);
            font-size: 10px;
            font-weight: 500;
            text-decoration: none;
            transition: color 0.2s;
            min-height: 56px;
        }
        .nav-item.active { color: var(--secondary); }
        .nav-item svg { width: 22px; height: 22px; }

        /* Cards */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: var(--shadow-sm);
        }
        .card-title { font-weight: 600; font-size: 15px; margin-bottom: 4px; color: var(--text-primary); }

        /* Buttons */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius-btn);
            font-weight: 600;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            min-height: 44px;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:active { transform: scale(0.98); background: #0d2133; }
        .btn-secondary { background: var(--bg); color: var(--primary); border: 1px solid var(--border); }
        .btn-teal { background: var(--secondary); color: white; }
        .btn-danger { background: rgba(217, 83, 79, 0.1); color: var(--danger); }
        .btn-sm { width: auto; padding: 6px 12px; font-size: 12px; min-height: 32px; }

        /* Badges */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge-success { background: rgba(21, 154, 140, 0.1); color: var(--success); }
        .badge-warning { background: rgba(216, 155, 40, 0.1); color: var(--warning); }
        .badge-danger { background: rgba(217, 83, 79, 0.1); color: var(--danger); }
        .badge-info { background: rgba(16, 42, 67, 0.05); color: var(--primary); }
        .badge-free { background: var(--secondary); color: white; }

        /* Content Area */
        .content { padding: 16px; }
        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
        }
        .list-item:last-child { border-bottom: none; }
        
        /* Scanner */
        .scanner-frame {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            background: #0d2133;
            border-radius: var(--radius-card);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .scanner-corner {
            position: absolute;
            width: 30px; height: 30px;
            border: 3px solid var(--secondary);
        }
        .scanner-top-left { top: 20px; left: 20px; border-right: none; border-bottom: none; border-radius: 8px 0 0 0; }
        .scanner-top-right { top: 20px; right: 20px; border-left: none; border-bottom: none; border-radius: 0 8px 0 0; }
        .scanner-bottom-left { bottom: 20px; left: 20px; border-right: none; border-top: none; border-radius: 0 0 0 8px; }
        .scanner-bottom-right { bottom: 20px; right: 20px; border-left: none; border-top: none; border-radius: 0 0 8px 0; }
        
        .scan-line {
            position: absolute;
            left: 20px; right: 20px;
            height: 2px;
            background: var(--secondary);
            box-shadow: 0 0 10px var(--secondary);
            animation: scan 2s linear infinite;
        }
        @keyframes scan {
            0% { top: 30px; }
            50% { top: calc(100% - 30px); }
            100% { top: 30px; }
        }

        /* Stepper */
        .stepper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 16px 0;
        }
        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-align: center;
            flex: 1;
            position: relative;
        }
        .step-circle {
            width: 28px; height: 28px;
            border-radius: 50%;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            z-index: 1;
        }
        .step.active .step-circle { background: var(--secondary); color: white; border-color: var(--secondary); }
        .step.completed .step-circle { background: var(--success); color: white; border-color: var(--success); }
        .step-label { font-size: 10px; color: var(--text-secondary); }
        .step.active .step-label { color: var(--primary); font-weight: 600; }
        .step-line {
            position: absolute;
            top: 14px; left: 50%; width: 100%; height: 1px;
            background: var(--border); z-index: 0;
        }
        .step:last-child .step-line { display: none; }

        /* Toast */
        .toast {
            position: fixed;
            bottom: calc(90px + var(--safe-bottom));
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            box-shadow: var(--shadow-lg);
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
            max-width: 90%;
            text-align: center;
        }
        .toast.show { opacity: 1; bottom: calc(100px + var(--safe-bottom)); }

        /* Bottom Sheet */
        .sheet-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
        }
        .sheet-overlay.show { opacity: 1; pointer-events: auto; }
        .bottom-sheet {
            position: fixed;
            bottom: 0; left: 50%;
            transform: translateX(-50%) translateY(100%);
            width: 100%;
            max-width: 480px;
            background: var(--card);
            border-radius: 20px 20px 0 0;
            padding: 24px 16px calc(24px + var(--safe-bottom));
            z-index: 1001;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .bottom-sheet.show { transform: translateX(-50%) translateY(0); }
        .sheet-handle {
            width: 40px; height: 4px;
            background: var(--border);
            border-radius: 2px;
            margin: 0 auto 16px;
        }

        /* Splash */
        .splash {
            position: fixed; inset: 0;
            background: var(--primary);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            transition: 0.5s;
        }
        .splash.hide { opacity: 0; pointer-events: none; }
        .splash-logo {
            width: 80px; height: 80px;
            border: 2px solid var(--secondary);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            position: relative;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(21, 154, 140, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(21, 154, 140, 0); }
            100% { box-shadow: 0 0 0 0 rgba(21, 154, 140, 0); }
        }
        
        /* QR Code Grid */
        .qr-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 2px;
            width: 160px;
            height: 160px;
            padding: 8px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin: 16px auto;
        }
        .qr-cell {
            background: transparent;
        }
        .qr-cell.filled {
            background: var(--primary);
        }

        /* Government Dashboard */
        .gov-layout {
            display: flex;
            min-height: 100vh;
        }
        .gov-sidebar {
            width: 240px;
            background: var(--primary);
            color: white;
            padding: 24px 0;
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
            transition: 0.3s;
            z-index: 1001;
        }
        .gov-main {
            flex: 1;
            margin-left: 240px;
            padding: 24px;
        }
        .gov-nav-item {
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: rgba(255,255,255,0.7);
            font-size: 14px;
            cursor: pointer;
        }
        .gov-nav-item.active { background: rgba(255,255,255,0.1); color: white; }
        
        /* Charts */
        .chart-bar {
            height: 24px;
            background: var(--bg);
            border-radius: 4px;
            position: relative;
            margin-bottom: 8px;
        }
        .chart-fill {
            height: 100%;
            border-radius: 4px;
            background: var(--secondary);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 8px;
            color: white;
            font-size: 11px;
            font-weight: 600;
        }

        @media (min-width: 768px) {
            #app-container { box-shadow: 0 0 40px rgba(0,0,0,0.08); }
        }
        @media (max-width: 1024px) {
            .gov-sidebar { transform: translateX(-100%); }
            .gov-sidebar.open { transform: translateX(0); }
            .gov-main { margin-left: 0; }
        }

        .hidden { display: none !important; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Splash Screen -->
    <div class="splash" id="splash">
        <div class="splash-logo">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#159A8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2v6M12 16v6M2 12h6M16 12h6"/>
                <rect x="8" y="8" width="8" height="8" rx="2" />
            </svg>
        </div>
        <h1 style="font-size: 28px; margin-bottom: 8px;">MedScan+</h1>
        <p style="color: rgba(255,255,255,0.8); margin-bottom: 32px; max-width: 280px; font-size: 14px;">
            Smart Medicine Safety & Recovery Platform
        </p>
        <p style="color: rgba(255,255,255,0.4); font-size: 12px; position: absolute; bottom: 40px;">
            Rajasthan Ideathon 2026
        </p>
    </div>

    <!-- Main App Container -->
    <div id="app-container"></div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Bottom Sheet -->
    <div class="sheet-overlay" id="sheetOverlay" onclick="closeBottomSheet()"></div>
    <div class="bottom-sheet" id="bottomSheet">
        <div class="sheet-handle"></div>
        <div id="sheetContent"></div>
    </div>

    <script>
        // js/data.js
        const demoData = {
            user: { name: "Rahul Sharma", location: "Jaipur, Rajasthan" },
            medicines: [
                { id: 1, name: "Metformin", strength: "500 mg", type: "Tablet", schedule: "Morning", time: "08:00 AM", duration: "30 days", status: "active", takenToday: true, expiry: "2027-08-15", batch: "MTF2024A", mfg: "Sun Pharma", composition: "Metformin Hydrochloride", match: true },
                { id: 2, name: "Amlodipine", strength: "5 mg", type: "Tablet", schedule: "Night", time: "08:00 PM", duration: "30 days", status: "active", takenToday: false, expiry: "2026-12-01", batch: "AML2024B", mfg: "Cipla", composition: "Amlodipine Besylate", match: true },
                { id: 3, name: "Vitamin D3", strength: "60,000 IU", type: "Capsule", schedule: "Weekly", time: "Sunday 09:00 AM", duration: "8 weeks", status: "active", takenToday: false, expiry: "2026-03-01", batch: "VTD2024C", mfg: "Mankind", composition: "Cholecalciferol", match: true }
            ],
            facilities: [
                { id: 1, name: "Government PHC", area: "Jaipur Rural", distance: "2.1 km", cost: "FREE", type: "Government", availability: true },
                { id: 2, name: "Jan Aushadhi Kendra", area: "Sanganer", distance: "3.5 km", cost: "₹8", type: "Generic", availability: true },
                { id: 3, name: "Local Pharmacy", area: "Malviya Nagar", distance: "0.8 km", cost: "₹42", type: "Private", availability: true },
                { id: 4, name: "Government Hospital", area: "Jaipur", distance: "4.8 km", cost: "FREE", type: "Government", availability: false }
            ],
            recovery: [
                { id: "MSR-2026-00481", date: "12 AUG 2026", med: "Metformin 500 mg", status: "Returned", facility: "Govt PHC Jaipur" },
                { id: "MSR-2026-00465", date: "10 JUL 2026", med: "Vitamin D3", status: "Not Eligible", facility: "-", reason: "Packaging condition" }
            ],
            family: [
                { id: 1, name: "Rahul", role: "You", meds: 3 },
                { id: 2, name: "Father", role: "Parent", meds: 2 },
                { id: 3, name: "Mother", role: "Parent", meds: 3 },
                { id: 4, name: "Child", role: "Dependent", meds: 1 }
            ],
            govStats: {
                verified: 1284,
                mismatches: 37,
                recoveryReq: 146,
                eligibleReturns: 91,
                successRate: 94,
                topMismatches: [
                    { area: "Jaipur Rural", count: 18 },
                    { area: "Sanganer", count: 9 },
                    { area: "Amer", count: 6 },
                    { area: "Other", count: 4 }
                ]
            }
        };

        // js/storage.js
        const Storage = {
            get: (key, def) => {
                const val = localStorage.getItem('medscan_' + key);
                return val ? JSON.parse(val) : def;
            },
            set: (key, val) => {
                localStorage.setItem('medscan_' + key, JSON.stringify(val));
            }
        };

        // js/app.js
        const App = {
            init() {
                setTimeout(() => {
                    document.getElementById('splash').classList.add('hide');
                    this.navigate('home');
                }, 2000);
                this.bindNav();
            },
            bindNav() {
                document.body.addEventListener('click', (e) => {
                    const target = e.target.closest('[data-route]');
                    if (target) {
                        e.preventDefault();
                        const route = target.getAttribute('data-route');
                        const param = target.getAttribute('data-param');
                        this.navigate(route, param);
                    }
                });
            },
            navigate(route, param = null) {
                const container = document.getElementById('app-container');
                container.scrollTop = 0;
                
                // Handle Government mode layout change
                if (route.startsWith('government')) {
                    container.classList.add('gov-mode');
                } else {
                    container.classList.remove('gov-mode');
                }

                const routeHandler = Routes[route];
                if (routeHandler) {
                    container.innerHTML = routeHandler(param);
                    if (route === 'government') container.innerHTML += GovDashboard.layout(param);
                    window.scrollTo(0, 0);
                } else {
                    container.innerHTML = `<div class="content"><h1>404</h1></div>`;
                }

                // Re-render icons if using a library, here we use static SVG strings
            },
            toast(msg) {
                const t = document.getElementById('toast');
                t.innerText = msg;
                t.classList.add('show');
                setTimeout(() => t.classList.remove('show'), 2500);
            }
        };

        // js/components.js
        const Components = {
            bottomNav: `
                <nav class="bottom-nav">
                    <a href="#" data-route="home" class="nav-item active" id="nav-home">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                        Home
                    </a>
                    <a href="#" data-route="find" class="nav-item" id="nav-find">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        Find
                    </a>
                    <a href="#" data-route="medicines" class="nav-item" id="nav-medicines">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 20.5 3.5 13.5a4.95 4.95 0 0 1 7-7l7 7a4.95 4.95 0 0 1-7 7Z"/><path d="m8.5 8.5 7 7"/></svg>
                        My Meds
                    </a>
                    <a href="#" data-route="recover" class="nav-item" id="nav-recover">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 19H4.815a1.83 1.83 0 0 1-1.57-.881 1.785 1.785 0 0 1-.004-1.784L7.196 9.5"/><path d="M11 19h8.203a1.83 1.83 0 0 0 1.556-.89 1.784 1.784 0 0 0 0-1.775l-1.226-2.12"/><path d="m14 16-3 3 3 3"/><path d="M8.293 13.596 7.196 9.5 3.1 10.598"/><path d="m9.344 5.811 1.093-1.892A1.83 1.83 0 0 1 11.985 3a1.784 1.784 0 0 1 1.546.888l3.976 6.887"/><path d="m13.378 9.633 4.096 1.098 1.097-4.096"/></svg>
                        Recover
                    </a>
                    <a href="#" data-route="profile" class="nav-item" id="nav-profile">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        Profile
                    </a>
                </nav>
            `,
            header: (title, sub, back = false) => `
                <div class="app-header">
                    <div style="display:flex; align-items:center; gap:12px;">
                        ${back ? `<div class="header-action" onclick="history.back()" style="margin-right:4px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></div>` : ''}
                        <div>
                            <h1>${title}</h1>
                            ${sub ? `<div class="sub">${sub}</div>` : ''}
                        </div>
                    </div>
                    <div class="header-action" data-route="notifications">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
                    </div>
                </div>
            `,
            updateNav: (route) => {
                document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                const activeNav = document.getElementById('nav-' + route);
                if (activeNav) activeNav.classList.add('active');
            }
        };

        // js/navigation.js (Routes)
        const Routes = {
            home() {
