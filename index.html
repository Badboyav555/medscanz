<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#102A43" />
<meta name="description" content="MedScan+ — Smart Medicine Safety & Recovery Platform. Offline ideathon prototype." />
<title>MedScan+ — Smart Medicine Safety & Recovery Platform</title>
<style>
/* ============================================================
   01. TOKENS
   ============================================================ */
:root{
  --navy:#102A43;
  --navy-600:#1B3A57;
  --teal:#159A8C;
  --teal-700:#0F7E73;
  --teal-50:#E8F5F3;
  --bg:#F5F8FA;
  --card:#FFFFFF;
  --text:#102A43;
  --muted:#64748B;
  --muted-2:#94A3B8;
  --success:#159A8C;
  --success-50:#E8F5F3;
  --warn:#D89B28;
  --warn-50:#FDF6E7;
  --danger:#D9534F;
  --danger-50:#FDEDEC;
  --border:#E2E8F0;
  --border-strong:#CBD5E1;
  --r-card:16px;
  --r-lg:20px;
  --r-btn:12px;
  --r-sm:10px;
  --sh-sm:0 1px 2px rgba(16,42,67,.05);
  --sh:0 6px 20px rgba(16,42,67,.07);
  --sh-lg:0 18px 44px rgba(16,42,67,.16);
  --nav-h:64px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  font-family:Inter,"Inter var",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:14px;
  line-height:1.5;
  color:var(--text);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:8px}

/* ============================================================
   02. LAYOUT SHELL
   ============================================================ */
.shell{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  min-height:100dvh;
  background:var(--bg);
  position:relative;
  padding-bottom:calc(var(--nav-h) + 22px + env(safe-area-inset-bottom));
  overflow-x:hidden;
}
.shell.no-nav{padding-bottom:24px}
.page{animation:fadeUp .22s cubic-bezier(.2,.7,.3,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.pad{padding:16px}
.pad-t{padding-top:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-sm{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grow{flex:1;min-width:0}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}
.center{text-align:center}
.hide{display:none!important}

/* ============================================================
   03. TYPOGRAPHY
   ============================================================ */
.screen-title{font-size:26px;line-height:1.2;font-weight:700;letter-spacing:-.02em}
.screen-sub{font-size:13.5px;color:var(--muted);margin-top:4px;line-height:1.45}
.section-head{
  font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);margin-bottom:10px;
}
.card-title{font-size:15.5px;font-weight:650;letter-spacing:-.01em}
.caption{font-size:11.5px;color:var(--muted)}
.muted{color:var(--muted)}
.tiny{font-size:11px}
.strong{font-weight:650}

/* ============================================================
   04. HEADER
   ============================================================ */
.appheader{
  position:sticky;top:0;z-index:40;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
  padding:12px 16px calc(12px + env(safe-area-inset-top) * 0);
  padding-top:calc(12px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:12px;min-height:60px;
}
.appheader .h-title{font-size:17px;font-weight:670;letter-spacing:-.015em;line-height:1.2}
.appheader .h-sub{font-size:11.5px;color:var(--muted);margin-top:1px}
.icon-btn{
  width:42px;height:42px;min-width:42px;border-radius:12px;
  border:1px solid var(--border);background:#fff;color:var(--navy);
  display:grid;place-items:center;cursor:pointer;position:relative;
  transition:background .16s,border-color .16s;
}
.icon-btn:active{background:#F1F5F9}
.icon-btn.plain{border-color:transparent;background:transparent}
.icon-btn .dot{
  position:absolute;top:9px;right:9px;width:7px;height:7px;border-radius:50%;
  background:var(--danger);border:1.5px solid #fff;
}
.avatar-btn{
  width:42px;height:42px;border-radius:50%;background:var(--navy);color:#fff;
  display:grid;place-items:center;font-size:12.5px;font-weight:700;letter-spacing:.03em;
  border:none;cursor:pointer;flex:0 0 auto;
}
.avatar-btn.teal{background:var(--teal)}

/* ============================================================
   05. BOTTOM NAV
   ============================================================ */
.bottomnav{
  position:fixed;left:50%;bottom:0;transform:translateX(-50%);
  width:100%;max-width:480px;z-index:50;
  background:rgba(255,255,255,.97);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--border);
  display:flex;align-items:stretch;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.navitem{
  flex:1;min-width:0;min-height:52px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:none;border:none;cursor:pointer;border-radius:12px;
  color:var(--muted-2);padding:4px 2px;
  transition:color .16s,background .16s;
}
.navitem span{font-size:10px;font-weight:650;letter-spacing:.02em;white-space:nowrap}
.navitem.active{color:var(--teal)}
.navitem.active span{color:var(--teal)}
.navitem:active{background:#F1F5F9}

/* ============================================================
   06. CARDS
   ============================================================ */
.card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--r-card);padding:16px;
}
.card.tight{padding:13px 14px}
.card.flush{padding:0;overflow:hidden}
.card.teal-tint{background:linear-gradient(160deg,#F0FAF8,#FFFFFF 62%);border-color:#CFEAE6}
.card.warn-tint{background:linear-gradient(160deg,#FFFBF1,#FFFFFF 62%);border-color:#F2E1BC}
.card.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.card.navy .muted{color:#9FB3C8}
.divider{height:1px;background:var(--border);margin:12px 0}

/* ============================================================
   07. BUTTONS
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:46px;padding:0 18px;border-radius:var(--r-btn);
  border:1px solid transparent;font-size:14px;font-weight:640;letter-spacing:-.005em;
  cursor:pointer;transition:transform .12s,background .16s,border-color .16s,box-shadow .16s;
  white-space:nowrap;user-select:none;
}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:active{background:var(--navy-600)}
.btn-teal{background:var(--teal);color:#fff}
.btn-teal:active{background:var(--teal-700)}
.btn-ghost{background:#fff;border-color:var(--border-strong);color:var(--navy)}
.btn-ghost:active{background:#F1F5F9}
.btn-soft{background:var(--teal-50);color:var(--teal-700);border-color:#CFEAE6}
.btn-danger-soft{background:var(--danger-50);color:var(--danger);border-color:#F5D3D1}
.btn-warn-soft{background:var(--warn-50);color:#8A6415;border-color:#F2E1BC}
.btn-block{width:100%}
.btn-sm{min-height:38px;padding:0 13px;font-size:13px;border-radius:10px}
.btn-lg{min-height:52px;font-size:15px}
.btn-row{display:flex;gap:10px}
.btn-row .btn{flex:1;min-width:0}
.link-btn{
  background:none;border:none;padding:0;color:var(--teal);font-weight:640;
  font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;
}
.link-btn:active{opacity:.7}

/* ============================================================
   08. BADGES / PILLS
   ============================================================ */
.badge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:10.5px;font-weight:700;letter-spacing:.055em;text-transform:uppercase;
  padding:5px 9px;border-radius:8px;white-space:nowrap;line-height:1;
}
.badge-teal{background:var(--teal-50);color:var(--teal-700)}
.badge-navy{background:#EDF2F7;color:var(--navy)}
.badge-warn{background:var(--warn-50);color:#8A6415}
.badge-danger{background:var(--danger-50);color:#A63A37}
.badge-outline{background:#fff;border:1px solid var(--border-strong);color:var(--muted)}
.badge-solid-teal{background:var(--teal);color:#fff}
.badge-solid-warn{background:var(--warn);color:#fff}
.badge-solid-danger{background:var(--danger);color:#fff}

/* ============================================================
   09. LISTS / ROWS
   ============================================================ */
.list-row{
  display:flex;align-items:center;gap:12px;
  padding:13px 14px;background:#fff;border-bottom:1px solid var(--border);
  cursor:pointer;transition:background .15s;min-height:56px;
}
.list-row:last-child{border-bottom:none}
.list-row:active{background:#F8FAFC}
.list-ico{
  width:38px;height:38px;min-width:38px;border-radius:11px;display:grid;place-items:center;
  background:var(--teal-50);color:var(--teal-700);
}
.list-ico.navy{background:#EDF2F7;color:var(--navy)}
.list-ico.warn{background:var(--warn-50);color:#8A6415}
.list-ico.danger{background:var(--danger-50);color:var(--danger)}

/* ============================================================
   10. GRIDS
   ============================================================ */
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}

/* ============================================================
   11. HOME
   ============================================================ */
.home-head{
  padding:calc(16px + env(safe-area-inset-top)) 16px 16px;
  background:linear-gradient(180deg,#FFFFFF, rgba(255,255,255,0));
}
.greet{font-size:20px;font-weight:700;letter-spacing:-.02em}
.loc{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);margin-top:3px}
.head-actions{display:flex;align-items:center;gap:9px}

.journey-track{display:flex;position:relative;margin-top:18px;padding-bottom:2px}
.journey-track::before{
  content:'';position:absolute;left:11%;right:11%;top:16px;height:2px;background:var(--border);
}
.j-step{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;position:relative;z-index:1;min-width:0}
.j-num{
  width:34px;height:34px;border-radius:50%;background:#fff;border:2px solid var(--border);
  display:grid;place-items:center;font-size:11px;font-weight:750;color:var(--muted-2);
  transition:.2s;
}
.j-step.done .j-num{background:var(--teal);border-color:var(--teal);color:#fff}
.j-step.current .j-num{border-color:var(--teal);color:var(--teal);box-shadow:0 0 0 4px var(--teal-50)}
.j-label{font-size:9.5px;font-weight:750;letter-spacing:.07em;color:var(--muted)}
.j-step.done .j-label,.j-step.current .j-label{color:var(--navy)}

.action-card{
  background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;
  display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;
  transition:transform .12s,border-color .16s,box-shadow .16s;min-height:118px;
}
.action-card:active{transform:scale(.985);border-color:var(--border-strong)}
.action-card .ac-ico{
  width:36px;height:36px;border-radius:11px;display:grid;place-items:center;
  background:var(--teal-50);color:var(--teal-700);
}
.action-card .ac-ico.navy{background:#EDF2F7;color:var(--navy)}
.action-card .ac-ico.warn{background:var(--warn-50);color:#8A6415}
.action-card h4{font-size:13.5px;font-weight:660;letter-spacing:-.01em;line-height:1.25}
.action-card p{font-size:11.5px;color:var(--muted);line-height:1.35}

.med-card{
  background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;
  display:flex;align-items:center;gap:12px;
}
.med-card .mc-ico{
  width:40px;height:40px;min-width:40px;border-radius:12px;display:grid;place-items:center;
  background:#EDF2F7;color:var(--navy);
}
.med-card.taken .mc-ico{background:var(--teal-50);color:var(--teal-700)}
.med-card h4{font-size:14px;font-weight:650;letter-spacing:-.01em}
.med-card .time{font-size:12px;color:var(--muted);margin-top:2px}
.state-chip{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;
}
.state-chip.ok{color:var(--teal-700)}
.state-chip.wait{color:var(--warn)}

/* ============================================================
   12. SEARCH
   ============================================================ */
.searchbar{
  display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--border);
  border-radius:14px;padding:0 6px 0 14px;min-height:50px;
  transition:border-color .16s,box-shadow .16s;
}
.searchbar:focus-within{border-color:var(--teal);box-shadow:0 0 0 4px var(--teal-50)}
.searchbar input{
  flex:1;min-width:0;border:none;outline:none;background:none;
  font-size:14px;color:var(--text);padding:12px 0;
}
.searchbar input::placeholder{color:var(--muted-2)}
.searchbar .sb-btn{
  width:40px;height:40px;min-width:40px;border-radius:11px;border:none;cursor:pointer;
  background:var(--teal-50);color:var(--teal-700);display:grid;place-items:center;
}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;min-height:34px;padding:0 14px;border-radius:999px;
  border:1px solid var(--border-strong);background:#fff;color:var(--muted);
  font-size:12.5px;font-weight:620;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  transition:.16s;
}
.chip.active{background:var(--navy);border-color:var(--navy);color:#fff}

.facility-card{
  background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;
  display:flex;flex-direction:column;gap:10px;
}
.facility-card .fc-top{display:flex;align-items:flex-start;gap:12px}
.facility-card .fc-ico{
  width:40px;height:40px;min-width:40px;border-radius:12px;display:grid;place-items:center;
  background:#EDF2F7;color:var(--navy);
}
.facility-card h4{font-size:13.5px;font-weight:660;letter-spacing:-.01em;line-height:1.25}
.facility-card .fc-meta{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.facility-card .fc-price{font-size:14px;font-weight:700;color:var(--navy)}
.facility-card .fc-price.free{color:var(--teal-700)}

/* ============================================================
   13. SCANNER
   ============================================================ */
.scanner{
  position:relative;width:100%;aspect-ratio:1/1.12;border-radius:var(--r-lg);
  background:radial-gradient(120% 90% at 50% 0%,#173853 0%,#0B1E2E 100%);
  overflow:hidden;display:grid;place-items:center;
  border:1px solid #17364F;
}
.scanner .frame{
  position:absolute;inset:11%;border-radius:14px;
}
.scanner .corner{position:absolute;width:30px;height:30px;border:3px solid var(--teal);border-radius:4px}
.scanner .corner.tl{top:0;left:0;border-right:none;border-bottom:none;border-top-left-radius:12px}
.scanner .corner.tr{top:0;right:0;border-left:none;border-bottom:none;border-top-right-radius:12px}
.scanner .corner.bl{bottom:0;left:0;border-right:none;border-top:none;border-bottom-left-radius:12px}
.scanner .corner.br{bottom:0;right:0;border-left:none;border-top:none;border-bottom-right-radius:12px}
.scanline{
  position:absolute;left:6%;right:6%;height:2px;
  background:linear-gradient(90deg,transparent,#3FD8C5 20%,#3FD8C5 80%,transparent);
  box-shadow:0 0 16px rgba(63,216,197,.85);
  animation:scanMove 2.4s cubic-bezier(.45,0,.55,1) infinite;
}
@keyframes scanMove{0%,100%{top:14%}50%{top:84%}}
.scanner .sc-hint{
  position:relative;z-index:2;text-align:center;color:#BFD3E4;font-size:12.5px;
  padding:0 34px;line-height:1.5;max-width:280px;
}
.scanner .sc-hint .ic{color:#3FD8C5;margin-bottom:10px}
.scanner .sc-tag{
  position:absolute;top:14px;left:50%;transform:translateX(-50%);
  font-size:9.5px;font-weight:750;letter-spacing:.12em;color:#7FA0BC;
}

/* ============================================================
   14. STEPPER
   ============================================================ */
.stepper{display:flex;align-items:center;gap:6px}
.stepper .stp{flex:1;display:flex;flex-direction:column;gap:7px;min-width:0}
.stepper .stp-bar{height:4px;border-radius:4px;background:var(--border)}
.stepper .stp.done .stp-bar{background:var(--teal)}
.stepper .stp.current .stp-bar{background:var(--navy)}
.stepper .stp-label{
  font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.stepper .stp.done .stp-label,.stepper .stp.current .stp-label{color:var(--navy)}

/* ============================================================
   15. RESULT STATES
   ============================================================ */
.result-hero{
  display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:28px 18px 24px;
}
.result-mark{
  width:76px;height:76px;border-radius:50%;display:grid;place-items:center;
  margin-bottom:16px;position:relative;
}
.result-mark.ok{background:var(--teal-50);color:var(--teal-700)}
.result-mark.warn{background:var(--warn-50);color:#B5821F}
.result-mark.danger{background:var(--danger-50);color:var(--danger)}
.result-mark::after{
  content:'';position:absolute;inset:-8px;border-radius:50%;border:1.5px solid currentColor;
  opacity:.18;animation:ringPulse 2s ease-out infinite;
}
@keyframes ringPulse{0%{transform:scale(.9);opacity:.3}70%{transform:scale(1.12);opacity:0}100%{opacity:0}}
.pop{animation:pop .38s cubic-bezier(.2,1.4,.5,1)}
@keyframes pop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}

.compare{
  display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;
  background:#F8FAFC;border:1px solid var(--border);border-radius:14px;padding:14px;
}
.compare .cmp-box{min-width:0}
.compare .cmp-lbl{font-size:9.5px;font-weight:750;letter-spacing:.09em;color:var(--muted-2);text-transform:uppercase}
.compare .cmp-val{font-size:13.5px;font-weight:660;margin-top:5px;line-height:1.3;word-break:break-word}
.compare .cmp-mid{color:var(--muted-2)}

/* ============================================================
   16. PROGRESS / METERS
   ============================================================ */
.progress{height:7px;border-radius:7px;background:#EDF2F7;overflow:hidden}
.progress > span{display:block;height:100%;border-radius:7px;background:var(--teal);transition:width .5s ease}
.progress.warn > span{background:var(--warn)}
.progress.danger > span{background:var(--danger)}

.dots{display:flex;gap:8px;justify-content:space-between}
.dot-day{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1}
.dot-day .dd{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  font-size:11px;font-weight:700;border:1.5px solid var(--border);color:var(--muted-2);background:#fff}
.dot-day.done .dd{background:var(--teal);border-color:var(--teal);color:#fff}
.dot-day.miss .dd{background:#fff;border-color:#F0C9C7;color:var(--danger)}
.dot-day.today .dd{border-color:var(--navy);color:var(--navy);border-width:2px}
.dot-day .dl{font-size:10px;font-weight:650;color:var(--muted)}

/* ============================================================
   17. TIMELINE
   ============================================================ */
.timeline{position:relative;padding-left:26px}
.timeline::before{content:'';position:absolute;left:8px;top:8px;bottom:8px;width:2px;background:var(--border)}
.tl-item{position:relative;padding-bottom:18px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{
  content:'';position:absolute;left:-24px;top:5px;width:11px;height:11px;border-radius:50%;
  background:#fff;border:2.5px solid var(--teal);
}
.tl-item.warn::before{border-color:var(--warn)}
.tl-item.danger::before{border-color:var(--danger)}
.tl-date{font-size:10.5px;font-weight:750;letter-spacing:.08em;color:var(--muted-2);text-transform:uppercase}
.tl-title{font-size:14px;font-weight:650;margin-top:4px}
.tl-sub{font-size:12px;color:var(--muted);margin-top:2px}

/* ============================================================
   18. CHECKLIST
   ============================================================ */
.check-item{
  display:flex;align-items:center;gap:11px;padding:12px 0;
  border-bottom:1px solid var(--border);
}
.check-item:last-child{border-bottom:none}
.check-mark{
  width:26px;height:26px;min-width:26px;border-radius:50%;display:grid;place-items:center;
  background:var(--teal-50);color:var(--teal-700);
}
.check-mark.no{background:#F1F5F9;color:var(--muted-2)}
.check-item .ci-label{font-size:13.5px;font-weight:560}

/* ============================================================
   19. SHEET / TOAST / OVERLAY
   ============================================================ */
.sheet-wrap{position:fixed;inset:0;z-index:200;display:flex;align-items:flex-end;justify-content:center}
.sheet-backdrop{position:absolute;inset:0;background:rgba(16,42,67,.45);opacity:0;transition:opacity .24s}
.sheet-wrap.open .sheet-backdrop{opacity:1}
.sheet{
  position:relative;width:100%;max-width:480px;background:#fff;
  border-radius:22px 22px 0 0;padding:10px 16px calc(22px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.3,1);
  max-height:88vh;overflow-y:auto;box-shadow:var(--sh-lg);
}
.sheet-wrap.open .sheet{transform:translateY(0)}
.sheet-grip{width:38px;height:4px;border-radius:4px;background:var(--border-strong);margin:6px auto 16px}

.toast-host{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));
  z-index:300;display:flex;flex-direction:column;gap:8px;width:calc(100% - 32px);max-width:420px;
  pointer-events:none;
}
.toast{
  display:flex;align-items:center;gap:10px;
  background:var(--navy);color:#fff;border-radius:12px;padding:13px 15px;
  font-size:13px;font-weight:560;box-shadow:var(--sh-lg);
  opacity:0;transform:translateY(12px);transition:.24s cubic-bezier(.2,.8,.3,1);
}
.toast.in{opacity:1;transform:none}
.toast.warn{background:#8A6415}
.toast.danger{background:#A63A37}
.toast .ic{flex:0 0 auto}
.toast span{min-width:0}

.overlay{
  position:fixed;inset:0;z-index:400;background:rgba(11,30,46,.86);
  backdrop-filter:blur(6px);display:grid;place-items:center;padding:24px;
  animation:fadeIn .2s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.scan-modal{
  background:#fff;border-radius:20px;padding:30px 24px;text-align:center;
  width:100%;max-width:320px;box-shadow:var(--sh-lg);
}
.scan-spinner{
  width:52px;height:52px;margin:0 auto 18px;border-radius:50%;
  border:3px solid var(--teal-50);border-top-color:var(--teal);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.scan-msg{font-size:14px;font-weight:600;color:var(--navy);animation:fadeUp .3s ease}

/* ============================================================
   20. CHARTS
   ============================================================ */
.bar-row{display:flex;align-items:center;gap:12px;padding:9px 0}
.bar-row .bl{font-size:12.5px;color:var(--muted);width:104px;min-width:104px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;height:9px;border-radius:9px;background:#EDF2F7;overflow:hidden;min-width:0}
.bar-fill{height:100%;border-radius:9px;background:var(--teal);transition:width .6s cubic-bezier(.2,.8,.3,1)}
.bar-fill.navy{background:var(--navy)}
.bar-fill.warn{background:var(--warn)}
.bar-fill.danger{background:var(--danger)}
.bar-row .bv{font-size:12.5px;font-weight:680;width:40px;text-align:right;flex:0 0 auto}

.kpi{
  background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;
  display:flex;flex-direction:column;gap:6px;min-width:0;
}
.kpi .k-lbl{font-size:9.5px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);line-height:1.3}
.kpi .k-val{font-size:24px;font-weight:720;letter-spacing:-.03em;line-height:1;color:var(--navy)}
.kpi .k-tag{font-size:9px;font-weight:700;letter-spacing:.07em;color:var(--muted-2)}
.kpi.teal .k-val{color:var(--teal-700)}
.kpi.warn .k-val{color:#B5821F}
.kpi.danger .k-val{color:var(--danger)}

/* ============================================================
   21. MISC
   ============================================================ */
.qr{
  display:grid;gap:0;width:196px;height:196px;padding:12px;background:#fff;
  border:1px solid var(--border);border-radius:14px;margin:0 auto;
  grid-template-columns:repeat(25,1fr);grid-template-rows:repeat(25,1fr);
}
.qr i{display:block;background:transparent;border-radius:1px}
.qr i.on{background:#102A43}

.map-panel{
  position:relative;height:190px;border-radius:var(--r-card);overflow:hidden;
  background:
    linear-gradient(0deg,rgba(21,154,140,.05),rgba(21,154,140,.05)),
    repeating-linear-gradient(0deg,#E9EFF4 0 1px,transparent 1px 34px),
    repeating-linear-gradient(90deg,#E9EFF4 0 1px,transparent 1px 34px),
    #F2F6F9;
  border:1px solid var(--border);
}
.map-road{position:absolute;background:#DCE5EC;border-radius:4px}
.map-pin{
  position:absolute;transform:translate(-50%,-100%);
  display:flex;flex-direction:column;align-items:center;gap:2px;
}
.map-pin .mp-dot{
  width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid var(--teal);
  display:grid;place-items:center;color:var(--teal-700);box-shadow:0 3px 8px rgba(16,42,67,.18);
}
.map-pin.sel .mp-dot{background:var(--teal);color:#fff;border-color:#fff}
.map-pin .mp-lbl{
  font-size:9px;font-weight:700;background:#fff;border:1px solid var(--border);
  padding:2px 6px;border-radius:6px;white-space:nowrap;color:var(--navy);
}
.map-badge{
  position:absolute;left:12px;bottom:12px;font-size:9.5px;font-weight:700;letter-spacing:.08em;
  background:rgba(255,255,255,.95);border:1px solid var(--border);color:var(--muted);
  padding:5px 9px;border-radius:8px;
}

.emptystate{text-align:center;padding:38px 22px}
.emptystate .es-ico{
  width:60px;height:60px;border-radius:18px;background:#F1F5F9;color:var(--muted-2);
  display:grid;place-items:center;margin:0 auto 16px;
}
.emptystate h4{font-size:15px;font-weight:650}
.emptystate p{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.5}

.skeleton{
  background:linear-gradient(90deg,#EDF2F7 25%,#F6F9FB 50%,#EDF2F7 75%);
  background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:10px;
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

.safety-note{
  display:flex;gap:10px;background:#F8FAFC;border:1px solid var(--border);
  border-radius:12px;padding:12px;font-size:12px;color:var(--muted);line-height:1.5;
}
.safety-note .ic{flex:0 0 auto;color:var(--muted-2);margin-top:1px}

/* ============================================================
   22. SPLASH
   ============================================================ */
.splash{
  position:fixed;inset:0;background:radial-gradient(130% 100% at 50% 0%,#1B3A57 0%,#102A43 45%,#0A1B2B 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px;z-index:500;color:#fff;text-align:center;
}
.splash .logo-mark{
  width:76px;height:76px;border-radius:22px;background:rgba(21,154,140,.14);
  border:1px solid rgba(63,216,197,.35);display:grid;place-items:center;color:#3FD8C5;
  margin-bottom:22px;animation:logoIn .8s cubic-bezier(.2,.9,.3,1) both;
}
@keyframes logoIn{0%{opacity:0;transform:scale(.86)}100%{opacity:1;transform:scale(1)}}
.splash h1{
  font-size:32px;font-weight:750;letter-spacing:-.035em;
  animation:fadeUp .7s .15s both;
}
.splash .sp-sub{
  font-size:12.5px;color:#9FB3C8;letter-spacing:.02em;margin-top:9px;max-width:280px;line-height:1.5;
  animation:fadeUp .7s .25s both;
}
.splash .sp-tag{
  font-size:14px;color:#CFE0EE;margin-top:26px;line-height:1.65;font-style:italic;
  animation:fadeUp .7s .4s both;
}
.splash .sp-foot{
  position:absolute;bottom:calc(36px + env(safe-area-inset-bottom));
  font-size:10.5px;font-weight:750;letter-spacing:.16em;color:#5D7A93;
  animation:fadeUp .7s .6s both;
}
.splash .sp-line{
  width:36px;height:2px;background:rgba(63,216,197,.5);border-radius:2px;margin:26px auto 0;
  animation:fadeUp .7s .5s both;
}

/* ============================================================
   23. GOVERNMENT DASHBOARD
   ============================================================ */
.gov{display:flex;min-height:100vh;min-height:100dvh;background:var(--bg);width:100%}
.gov-side{
  position:fixed;top:0;bottom:0;left:0;width:246px;z-index:120;
  background:var(--navy);color:#fff;display:flex;flex-direction:column;
  transform:translateX(-100%);transition:transform .28s cubic-bezier(.2,.8,.3,1);
  overflow-y:auto;
}
.gov.side-open .gov-side{transform:translateX(0)}
.gov-side-backdrop{
  position:fixed;inset:0;background:rgba(16,42,67,.5);z-index:110;opacity:0;
  pointer-events:none;transition:opacity .25s;
}
.gov.side-open .gov-side-backdrop{opacity:1;pointer-events:auto}
.gov-brand{padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,.09)}
.gov-brand .gb-name{font-size:16px;font-weight:750;letter-spacing:-.02em}
.gov-brand .gb-name span{color:#3FD8C5}
.gov-brand .gb-sub{font-size:10.5px;color:#9FB3C8;letter-spacing:.05em;margin-top:5px;text-transform:uppercase;font-weight:650}
.gov-nav{padding:14px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.gov-nav-item{
  display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;
  color:#B7C9DA;font-size:13.5px;font-weight:580;cursor:pointer;background:none;border:none;
  text-align:left;width:100%;transition:background .15s,color .15s;min-height:44px;
}
.gov-nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.gov-nav-item.active{background:rgba(21,154,140,.2);color:#fff}
.gov-nav-item.active .ic{color:#3FD8C5}
.gov-side-foot{padding:16px 20px 22px;border-top:1px solid rgba(255,255,255,.09)}
.gov-main{flex:1;min-width:0;display:flex;flex-direction:column}
.gov-top{
  position:sticky;top:0;z-index:60;background:#fff;border-bottom:1px solid var(--border);
  padding:12px 16px;display:flex;align-items:center;gap:12px;
  padding-top:calc(12px + env(safe-area-inset-top));
}
.gov-top h1{font-size:16px;font-weight:700;letter-spacing:-.02em}
.gov-top .gt-sub{font-size:11px;color:var(--muted);margin-top:1px}
.gov-content{padding:16px;display:flex;flex-direction:column;gap:14px;max-width:1400px;width:100%}
.gov-hamburger{display:grid}
.gov-sec-title{font-size:15px;font-weight:680;letter-spacing:-.015em}

.gov-table{width:100%;border-collapse:collapse;font-size:13px}
.gov-table th{
  text-align:left;font-size:10px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;
}
.gov-table td{padding:13px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.gov-table tr:last-child td{border-bottom:none}
.gov-table tbody tr:hover{background:#F8FAFC}

.report-card{
  background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;
  display:flex;flex-direction:column;gap:12px;
}

/* ============================================================
   24. RESPONSIVE
   ============================================================ */
@media (min-width:768px){
  body{background:#E8EEF3}
  .shell{
    box-shadow:0 0 0 1px var(--border),0 24px 60px rgba(16,42,67,.09);
    min-height:100vh;background:var(--bg);
  }
  .bottomnav{
    box-shadow:0 -6px 24px rgba(16,42,67,.06);
  }
}
@media (min-width:1100px){
  .shell{max-width:520px}
  .bottomnav{max-width:520px}
}
@media (min-width:960px){
  .gov-side{transform:none;position:sticky;top:0;height:100vh;height:100dvh}
  .gov-side-backdrop{display:none}
  .gov-hamburger{display:none}
  .gov-content{padding:24px 28px;gap:18px}
}
@media (max-width:359px){
  .screen-title{font-size:23px}
  .j-label{font-size:8.5px}
  .j-num{width:30px;height:30px;font-size:10px}
  .grid-2{gap:8px}
  .action-card{padding:12px;min-height:110px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      const merged = Object.assign({}, DEFAULT_STATE, parsed);
      merged.plan = Array.isArray(merged.plan) ? merged.plan : DEFAULT_STATE.plan.slice();
      return merged;
    }
  }catch(e){ /* localStorage unavailable — run in memory */ }
  return JSON.parse(JSON.stringify(DEFAULT_STATE));
}
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}
function resetState(){
  state = JSON.parse(JSON.stringify(DEFAULT_STATE));
  saveState();
}

function esc(s){

    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function greeting(){
  const h = new Date().getHours();
  if(h < 12) return 'Good morning';
  if(h < 17) return 'Good afternoon';
  return 'Good evening';
}
function todayKey(){ return new Date().toISOString().slice(0,10); }
function dayKey(d){ return d.toISOString().slice(0,10); }

function currentWeek(){
  const now = new Date();
  const dow = (now.getDay() + 6) % 7; // Monday = 0
  const mon = new Date(now); mon.setDate(now.getDate() - dow);
  return Array.from({length:7}, function(_, i){
    const d = new Date(mon); d.setDate(mon.getDate() + i); return d;
  });
}

const portal = document.getElementById('portal');

function toast(msg, kind){
  let host = document.querySelector('.toast-host');
  if(!host){
    host = document.createElement('div');
    host.className = 'toast-host';
    document.body.appendChild(host);
  }
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  const ic = kind === 'warn' || kind === 'danger' ? 'alert' : 'check';
  el.innerHTML = icon(ic, 17) + '<span>' + esc(msg) + '</span>';
  host.appendChild(el);
  requestAnimationFrame(function(){ el.classList.add('in'); });
  setTimeout(function(){
    el.classList.remove('in');
    setTimeout(function(){ el.remove(); }, 260);
  }, 2600);
}

  wrap.addEventListener('click', function(e){

}

function trendChart(values, labels){
  const w = 300, h = 96, pad = 8;
  const max = Math.max.apply(null, values) || 1;
  const step = (w - pad * 2) / (values.length - 1);
  const pts = values.map(function(v, i){
    const x = pad + i * step;
    const y = h - pad - (v / max) * (h - pad * 2.4);
    return [x, y];
  });
  const line = pts.map(function(p, i){ return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
  const area = line + ' L' + pts[pts.length-1][0].toFixed(1) + ' ' + (h - pad) + ' L' + pts[0][0].toFixed(1) + ' ' + (h - pad) + ' Z';
  const dots = pts.map(function(p){
    return '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="2.6" fill="#159A8C" stroke="#fff" stroke-width="1.4"/>';
  }).join('');
  const xlabels = (labels || []).map(function(l, i){
    const x = pad + i * step;
    return '<text x="' + x.toFixed(1) + '" y="' + (h + 2) + '" font-size="8" fill="#94A3B8" text-anchor="middle" font-family="Inter,system-ui,sans-serif">' + esc(l) + '</text>';
  }).join('');
  return '<svg viewBox="0 0 ' + w + ' ' + (h + 12) + '" width="100%" height="auto" role="img" aria-label="Trend chart">' +
    '<defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="#159A8C" stop-opacity="0.22"/>' +
      '<stop offset="100%" stop-color="#159A8C" stop-opacity="0"/>' +
    '</linearGradient></defs>' +
    '<path d="' + area + '" fill="url(#tg)"/>' +
    '<path d="' + line + '" fill="none" stroke="#159A8C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>' +
    dots + xlabels +
  '</svg>';
}

/* Deterministic demo QR (no external library) */
function demoQR(seed){
  const size = 25;
  let h = 2166136261;
  for(let i = 0; i < seed.length; i++){
    h ^= seed.charCodeAt(i);
    h = Math.imul(h, 16777619) >>> 0;
  }
  function rnd(){
    h ^= h << 13; h >>>= 0;
    h ^= h >> 17;
    h ^= h << 5; h >>>= 0;
    return h / 4294967296;
  }
  function finderRing(r, c){
    let br = -1, bc = -1;
    if(r < 7 && c < 7){ br = r; bc = c; }
    else if(r < 7 && c >= size - 7){ br = r; bc = c - (size - 7); }
    else if(r >= size - 7 && c < 7){ br = r - (size - 7); bc = c; }
    else return null;
    const ring = Math.max(Math.abs(br - 3), Math.abs(bc - 3));
    return ring === 3 || ring <= 1;
  }
  let cells = '';
  for(let r = 0; r < size; r++){
    for(let c = 0; c < size; c++){
      const fr = finderRing(r, c);
      let on;
      if(fr !== null){
        on = fr;
      } else if((r < 8 && c < 8) || (r < 8 && c >= size - 8) || (r >= size - 8 && c < 8)){
        on = false; // quiet zone around finders
      } else {
        on = rnd() > 0.52;
      }
      cells += '<i class="' + (on ? 'on' : '') + '"></i>';
    }
  }
  return '<div class="qr" role="img" aria-label="Demo return code ' + esc(seed) + '">' + cells + '</div>';
}

function renderFind(){
  const q = ui.query.trim().toLowerCase();
  let results = DEMO_FACILITIES.filter(function(f){ return f.availability === 'Available'; });
  if(q){
    results = results.filter(function(f){
      return (f.name + ' ' + f.short + ' ' + f.type).toLowerCase().indexOf(q) > -1;
    });
  }
  if(ui.sort === 'nearest') results = results.slice().sort(function(a,b){ return a.distance - b.distance; });
  if(ui.sort === 'cost'){
    results = results.slice().sort(function(a,b){
      const av = a.costType === 'free' ? 0 : (a.costType === 'low' ? 8 : 42);
      const bv = b.costType === 'free' ? 0 : (b.costType === 'low' ? 8 : 42);
      return av - bv;
    });
  }
  if(ui.sort === 'free') results = results.slice().sort(function(a,b){
    return (a.costType === 'free' ? 0 : 1) - (b.costType === 'free' ? 0 : 1);

  return '<div class="page">' +
    appHeader({

/* ============================================================
   SCREENS — SCHEDULE
   ============================================================ */
function renderSchedule(){
  const week = currentWeek();
  const today = todayKey();

  const slots = [
    { med:MED.metformin, time:'08:00 AM', slot:'08:00 AM' },
    { med:MED.vitaminD3 || MED['vitamin-d3'], time:'09:00 AM', slot:'09:00 AM' },
    { med:MED.amlodipine, time:'08:00 PM', slot:'08:00 PM' }
  ].filter(function(s){ return s.med; });

  let doneCount = 0;
  const dayDots = week.map(function(d, i){
    const k = dayKey(d);
    let cls = '';
    if(k < today){ cls = 'done'; doneCount++; }
    else if(k === today){ cls = isTaken('metformin','08:00 AM') ? 'done' : 'today'; if(cls === 'done') doneCount++; }
    return '<div class="dot-day ' + cls + '">' +
      '<div class="dd">' + (cls === 'done' ? icon('check', 14) : DAY_LETTERS[i]) + '</div>' +
      '<div class="dl">' + DAY_LETTERS[i] + '</div>' +
    '</div>';
  }).join('');

  return '<div class="page">' +
    appHeader({ title:"Today's Schedule", subtitle:'Based on demo prescription data', back:true }) +
    '<div class="pad stack">' +

      '<div class="chips">' +
        week.map(function(d, i){
          const k = dayKey(d);
          const isToday = k === today;
          return '<button class="chip' + (isToday ? ' active' : '') + '" data-action="toast" data-msg="Demo schedule is shown for today only.">' +
            DAY_LETTERS[i] + ' ' + d.getDate() + '</button>';
        }).join('') +
      '</div>' +

      '<section>' +
        '<p class="section-head">Timeline</p>' +
        '<div class="stack-sm">' +
          slots.map(function(s){
            const taken = isTaken(s.med.id, s.slot);
            return '<div class="card tight">' +
              '<div class="row">' +
                '<div class="list-ico ' + (taken ? '' : 'navy') + '">' + icon('clock', 17) + '</div>' +
                '<div class="grow">' +
                  '<div class="caption strong" style="color:#102A43">' + esc(s.time) + '</div>' +
                  '<div class="card-title" style="margin-top:2px">' + esc(medFull(s.med)) + '</div>' +
                '</div>' +
                (taken
                  ? '<span class="state-chip ok">' + icon('check', 15) + 'Taken</span>'
                  : '<span class="state-chip wait">Upcoming</span>') +
              '</div>' +
              (taken ? '' :
                '<div class="btn-row mt12" style="margin-top:12px">' +
                  '<button class="btn btn-teal btn-sm" data-action="mark-taken" data-med="' + s.med.id + '" data-slot="' + esc(s.slot) + '">Mark Taken</button>' +
                  '<button class="btn btn-ghost btn-sm" data-action="toast" data-msg="Reminder snoozed for 15 minutes (demo).">Snooze</button>' +
                '</div>'
              ) +
            '</div>';
          }).join('') +
        '</div>' +
      '</section>' +

      '<section class="card">' +
        '<p class="section-head">7 day overview</p>' +
        '<div class="dots">' + dayDots + '</div>' +
        '<div class="divider"></div>' +
        '<div class="row-between">' +
          '<span class="caption">Doses recorded</span>' +
          '<span class="strong" style="font-size:14px">' + Math.min(doneCount, 7) + ' / 7</span>' +
        '</div>' +
        '<p class="caption" style="margin-top:10px">Demo tracking data.</p>' +
      '</section>' +

      safetyNote('MedScan+ does not create dosage recommendations. Schedules follow demo prescription data only.')
    '</div>' +
    bottomNav('medicines') +
  '</div>';
}

function currentPath(){
  const raw = (location.hash || '#/').replace(/^#/, '');
  return raw === '' ? '/' : raw;
}

function resolve(path){
  const clean = path.replace(/\/+$/, '') || '/';
  if(ROUTES[clean]) return { key:clean, route:ROUTES[clean] };

  const medMatch = clean.match(/^\/medicine\/([\w-]+)$/);
  if(medMatch){
    return { key:'/medicine/:id', route:{ render:function(){ return renderMedicineDetail(medMatch[1]); }, nav:'medicines' } };
  }
  return { key:'404', route:{ render: renderNotFound, nav:null } };
}

  return '<div class="page">' +
    appHeader({ title:'Not found', back:true }) +

    '</div>' +
    bottomNav('home') +
  '</div>';
}

function navigate(to){
  if(currentPath() === to){ render(); return; }
  location.hash = '#' + to;
}

  ui.eligibility = 'pass';
  ui.sheetFacility = null;
  if(verifyTimer){ clearTimeout(verifyTimer); verifyTimer = null; }
  closeSheet();
}

function render(){
  const app = document.getElementById('app');
  const path = currentPath();
  const resolved = resolve(path);
  const route = resolved.route;

  // reset ephemeral state on real navigation (but keep within same screen re-renders)
  if(render._lastKey !== resolved.key){
    const keepConfirm = resolved.key === '/recover/confirm';
    const keepElig = resolved.key === '/recover/eligibility';
    const keepFamily = resolved.key === '/family';
    const keepVerify = resolved.key === '/verify';
    const prev = render._lastKey;
    resetTransient();
    if(keepConfirm && prev === '/recover/points') ui.confirm = false;
    if(keepElig && prev === '/recover/eligibility') ui.eligibility = ui.eligibility;
    if(keepFamily) ui.familyMember = ui.familyMember;
    if(keepVerify) ui.verify = 'idle';
  }
  render._lastKey = resolved.key;

  document.title = TITLES[resolved.key] || 'MedScan+';

  const html = route.render();
  app.innerHTML = route.bare ? html : html;

  // splash auto-advance
  if(resolved.key === '/'){
    if(splashTimer) clearTimeout(splashTimer);
    splashTimer = setTimeout(function(){ navigate('/home'); }, 2200);
  }

  // scroll to top on navigation
  window.scrollTo(0, 0);

  // wire live search input
  const input = document.getElementById('findInput');
  if(input){
    if(addInputHandler) input.removeEventListener('input', addInputHandler);
    addInputHandler = function(e){
      ui.query = e.target.value;
      const pos = e.target.selectionStart;
      const active = document.activeElement === e.target;
      render();
      if(active){
        const ni = document.getElementById('findInput');
        if(ni){ ni.focus(); try{ ni.setSelectionRange(pos, pos); }catch(err){} }
      }
    };
    input.addEventListener('input', addInputHandler);
  }
}

/* ============================================================
   EVENT DELEGATION
   ============================================================ */
document.addEventListener('click', function(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.getAttribute('data-action');

  switch(action){

    case 'nav': {
      const to = el.getAttribute('data-to');
      if(to) navigate(to);
      break;
    }

    case 'back': {
      if(window.history.length > 1) window.history.back();
      else navigate('/home');
      break;
    }

    case 'toast': {
      toast(el.getAttribute('data-msg') || '', el.getAttribute('data-kind') || '');
      break;
    }

    case 'directions': {
      toast('Live navigation is not connected in this offline prototype.', 'warn');
      break;
    }

    case 'sort': {
      ui.sort = el.getAttribute('data-value');
      render();
      break;
    }

    case 'clear-search': {
      ui.query = '';
      render();
      break;
    }

    case 'facility-sheet': {
      const f = FAC[el.getAttribute('data-id')];
      if(f) openSheet(facilitySheet(f));
      break;
    }

    case 'mark-taken': {
      const medId = el.getAttribute('data-med');
      const slot = el.getAttribute('data-slot');
      setTaken(medId, slot, true);
      toast('Dose marked as taken.');
      render();
      break;
    }

    /* ---------- prescription ---------- */
    case 'rx-demo': {
      scanSequence([
        'Reading prescription…',
        'Extracting medicine information…',
        'Prescription processed.'
      ], function(){
        toast('Demo prescription processed.');
        navigate('/prescription/result');
      });
      break;
    }

    case 'create-plan': {
      ['metformin','amlodipine'].forEach(function(id){
        if(state.plan.indexOf(id) === -1) state.plan.push(id);
      });
      saveState();
      toast('Medicine plan created.');
      navigate('/medicines');
      break;
    }

    /* ---------- verify ---------- */
    case 'verify-demo': {
      ui.verify = 'scanning';
      render();
      if(verifyTimer) clearTimeout(verifyTimer);
      verifyTimer = setTimeout(function(){
        ui.verify = 'match';
        render();
        toast('Prescription match confirmed.');
      }, 1700);
      break;
    }

    case 'verify-mismatch': {
      ui.verify = 'scanning';
      render();
      if(verifyTimer) clearTimeout(verifyTimer);
      verifyTimer = setTimeout(function(){
        ui.verify = 'mismatch';
        render();
        toast('Possible mismatch detected.', 'warn');
      }, 1700);
      break;
    }

    case 'verify-reset': {
      ui.verify = 'idle';
      render();
      break;
    }

    case 'add-to-plan': {
      const id = el.getAttribute('data-id');
      if(id && state.plan.indexOf(id) === -1){
        state.plan.push(id);
        saveState();
        toast('Medicine added to your plan.');
      } else {
        toast('Already in your medicine plan.');
      }
      break;
    }

    case 'open-add-med': {
      openSheet(addMedicineSheet());
      break;
    }

    case 'add-med': {
      const id = el.getAttribute('data-id');
      if(id && state.plan.indexOf(id) === -1){
        state.plan.push(id);
        saveState();
      }
      closeSheet();
      toast('Medicine added to your plan.');
      render();
      break;
    }

    /* ---------- recovery ---------- */
    case 'toggle-elig': {
      ui.eligibility = ui.eligibility === 'pass' ? 'fail' : 'pass';
      render();
      break;
    }

    case 'select-point': {
      const id = el.getAttribute('data-id');
      const f = FAC[id];
      if(f){
        toast('Return point selected: ' + f.short);
        ui.sheetFacility = id;
      }
      state.lastReturnId = 'MSR-2026-004' + (80 + Math.floor(Math.random() * 19));
      saveState();
      ui.confirm = false;
      navigate('/recover/confirm');
      break;
    }

    case 'simulate-staff': {
      const id = state.lastReturnId || 'MSR-2026-00481';
      const exists = state.recovery.some(function(r){ return r.id === id; });
      if(!exists){
        state.recovery.unshift({
          date: new Date().toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' }).toUpperCase(),
          med: 'Metformin 500 mg',
          status: 'Returned',
          tone: 'ok',
          facility: 'Government PHC — Jaipur',
          id: id
        });
        saveState();
      }
      ui.confirm = true;
      render();
      toast('Drop-off recorded.');
      break;
    }

    /* ---------- family ---------- */
    case 'family': {
      ui.familyMember = el.getAttribute('data-id');
      render();
      break;
    }

    /* ---------- notifications ---------- */
    case 'notif-read': {
      const id = el.getAttribute('data-id');
      state.notificationsRead[id] = true;
      saveState();
      render();
      break;
    }
    case 'notif-all': {
      NOTIFICATIONS.forEach(function(n){ state.notificationsRead[n.id] = true; });
      saveState();
      toast('All notifications marked as read.');
      render();
      break;
    }

    /* ---------- profile ---------- */
    case 'reset-demo': {
      resetState();
      ui = {
        verify:'idle', rx:'idle', confirm:false, eligibility:'pass',
        sort:'nearest', query:'', sheetFacility:null,
        familyMember:'rahul', scheduleDay:'today', scannedMed:'metformin'
      };
      render._lastKey = null;
      toast('Demo data reset.');
      navigate('/home');
      render();
      break;
    }

    /* ---------- government ---------- */
    case 'gov-open': {
      const g = document.getElementById('govShell');
      if(g) g.classList.add('side-open');
      break;
    }
    case 'gov-close': {
      const g = document.getElementById('govShell');
      if(g) g.classList.remove('side-open');
      break;
    }
    case 'gen-report': {
      const name = el.getAttribute('data-name') || 'Demo Report';
      generateDemoReport(name);
      break;
    }
  }
});

/* Close gov sidebar when navigating inside the dashboard */
document.addEventListener('click', function(e){
  const navEl = e.target.closest('.gov-nav-item');
  if(navEl){
    const g = document.getElementById('govShell');
    if(g) g.classList.remove('side-open');
  }
});

/* Close sheet on Escape */
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') closeSheet();
});

/* ============================================================
   DEMO REPORT GENERATION (local, no backend)
   ============================================================ */
function generateDemoReport(name){
  const lines = [
    'MEDSCAN+ — DEMO REPORT',
    '==============================',
    'Report: ' + name,
    'Region: Rajasthan Pilot (simulated)',
    'Generated: ' + new Date().toLocaleString('en-IN'),
    '',
    'IMPORTANT',
    'This report contains SIMULATED PROTOTYPE DATA.',
    'It is not an official government report and does not',
    'represent live medicine availability or redistribution.',
    '',
    '--- SUMMARY ---',
    'Medicines verified        : 1,284',
    'Possible mismatches       : 37',
    'Verification success      : 94%',
    'Recovery requests         : 146',
    'Potentially eligible      : 91',
    'Not eligible              : 55',
    '',
    '--- MISMATCHES BY AREA ---'
  ];
  GOV.safety.mismatchByArea.forEach(function(a){
    lines.push('  ' + a.label.padEnd(22, ' ') + ': ' + a.value);
  });
  lines.push('');
  lines.push('--- RECOVERY BY FACILITY ---');
  GOV.recovery.byFacility.forEach(function(f){
    lines.push('  ' + f.label.padEnd(26, ' ') + ': ' + f.value);
  });
  lines.push('');
  lines.push('--- FACILITIES ---');
  GOV.facilities.forEach(function(f){
    lines.push('  ' + f.name + ' | ' + f.status + ' | Verification: ' + f.verification + ' | Recovery: ' + f.recovery);
  });
  lines.push('');
  lines.push('End of demo report.');

  const blob = new Blob([lines.join('\n')], { type:'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'medscan-demo-' + name.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
  toast('Demo report generated.');
}

/* ============================================================
   BOOT
   ============================================================ */
window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', function(){
  if(!location.hash) location.hash = '#/';
  render();
});
if(document.readyState !== 'loading'){
  if(!location.hash) location.hash = '#/';
  render();
}
</script>
